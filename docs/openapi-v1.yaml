openapi: 3.1.0
info:
  title: Warun Tab Order Local API
  version: 1.0.0
  description: |
    店舗LAN内だけで動作する小規模居酒屋向け注文APIのv1契約。
    SQLiteにコミットされた状態を唯一の正本とし、RESTで操作、SSEで変更通知を行う。
    customer向けレスポンスには価格と合計を含めない。
servers:
  - url: https://{serverIp}:8443
    description: 本運用のローカルHTTPSサーバー
    variables:
      serverIp:
        default: 192.168.1.10
        description: ルーターで固定またはDHCP予約したサーバーIPv4アドレス
tags:
  - name: System
  - name: Pairing
  - name: Device
  - name: Menu
  - name: Orders
  - name: StaffCalls
  - name: Admin
  - name: Events
security:
  - bearerAuth: []
paths:
  /v1/health:
    get:
      tags: [System]
      summary: サーバーとDBの準備状態を確認する
      operationId: getHealth
      security: []
      responses:
        '200':
          description: DBを含めて受付可能
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          $ref: '#/components/responses/ReadOnlyServiceUnavailable'

  /v1/admin/pairing-codes:
    post:
      tags: [Admin, Pairing]
      summary: 一回限りの端末ペアリングコードを発行する
      description: adminだけが実行できる。customer用コードはtableId必須。
      operationId: createPairingCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePairingCodeRequest'
      responses:
        '201':
          description: コードを発行した。平文コードはこの応答でだけ返す。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairingCode'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '409':
          $ref: '#/components/responses/AssignmentConflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/pairings/claim:
    post:
      tags: [Pairing]
      summary: ペアリングコードを消費して端末を登録する
      operationId: claimPairingCode
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimPairingRequest'
      responses:
        '201':
          description: 端末登録成功。deviceTokenは再表示しない。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimPairingResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: コード使用済み、deviceId登録済み、または割り当て競合
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '410':
          description: ペアリングコードが失効済み
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/device/config:
    get:
      tags: [Device]
      summary: 認証端末の役割とサーバー側設定を取得する
      operationId: getDeviceConfig
      responses:
        '200':
          description: 端末設定
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/CustomerDeviceConfig'
                  - $ref: '#/components/schemas/KitchenDeviceConfig'
                  - $ref: '#/components/schemas/AdminDeviceConfig'
                discriminator:
                  propertyName: role
        '401':
          $ref: '#/components/responses/ReadOnlyAuthenticationFailed'
        '403':
          $ref: '#/components/responses/ReadOnlyAuthorizationFailed'
        '500':
          $ref: '#/components/responses/ReadOnlyInternalError'

  /v1/menu:
    get:
      tags: [Menu]
      summary: 認証端末の役割に応じた現在メニューを取得する
      description: customerにはpriceYenとkitchenAliasを返さず、kitchenにもpriceYenを返さない。
      operationId: getMenu
      responses:
        '200':
          description: 役割別メニューと取得時点のeventId
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/CustomerMenuResponse'
                  - $ref: '#/components/schemas/KitchenMenuResponse'
                  - $ref: '#/components/schemas/AdminMenuResponse'
                discriminator:
                  propertyName: audience
        '401':
          $ref: '#/components/responses/ReadOnlyAuthenticationFailed'
        '403':
          $ref: '#/components/responses/ReadOnlyAuthorizationFailed'
        '500':
          $ref: '#/components/responses/ReadOnlyInternalError'

  /v1/orders:
    post:
      tags: [Orders]
      summary: 客席端末から注文を送信する
      description: |
        customerだけが実行できる。deviceId、role、tableId、tableNumber、fingerprintは受け付けない。
        サーバーはBearer tokenから得た認証済みdeviceIdとサーバー側table assignmentからテーブルを決定する。
        サーバーは認証済みdeviceIdと注文品目からfingerprintを計算し、価格・売り切れをトランザクション内で検証する。
        Content-Typeはapplication/json（charsetはUTF-8だけ）とし、bodyは16 KiB以下に制限する。
        注文、全明細、event_logをコミットした後にだけSSE接続を起床する。SSE通知失敗はコミット済み注文を失敗へ戻さない。
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: 新しい注文を作成した
          headers:
            Idempotency-Result:
              schema:
                type: string
                const: created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderReceipt'
        '200':
          description: 同じclientOrderIdと同じサーバー計算fingerprintの再送。既存注文を返した。
          headers:
            Idempotency-Result:
              schema:
                type: string
                const: replayed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderReceipt'
        '400':
          $ref: '#/components/responses/OrderInvalidRequest'
        '401':
          $ref: '#/components/responses/ReadOnlyAuthenticationFailed'
        '403':
          $ref: '#/components/responses/ReadOnlyAuthorizationFailed'
        '409':
          $ref: '#/components/responses/OrderConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/OrderUnprocessable'
        '500':
          $ref: '#/components/responses/ReadOnlyInternalError'
        '503':
          $ref: '#/components/responses/ReadOnlyServiceUnavailable'

  /v1/orders/active:
    get:
      tags: [Orders]
      summary: キッチン用のアクティブ注文を取得する
      operationId: listActiveOrders
      responses:
        '200':
          description: newとactiveの注文。未提供品は各注文内で先に並ぶ。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveOrdersResponse'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '403':
          $ref: '#/components/responses/PermissionDenied'

  /v1/customer/order-history:
    get:
      tags: [Orders]
      summary: 現在のテーブル来店の客席履歴を取得する
      description: customerの割当tableにある現在open sessionの注文だけを返す。価格、合計、sessionId、tableId、厨房情報は返さない。session close後は空になり、次の注文で作成された新sessionの注文だけが返る。
      operationId: listCustomerOrderHistory
      responses:
        '200':
          description: 現在open sessionの注文を新しい順に返す
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerOrderHistoryResponse'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '403':
          $ref: '#/components/responses/PermissionDenied'

  /v1/kitchen/order-history:
    get:
      tags: [Orders]
      summary: 厨房の提供済み注文履歴を取得する
      description: 過去sessionを含むcompleted注文を新しい順に返す。close済みsessionの注文も削除せず保持する。
      operationId: listKitchenOrderHistory
      responses:
        '200':
          description: completed注文を新しい順に返す
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderHistoryResponse'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '403':
          $ref: '#/components/responses/PermissionDenied'

  /v1/admin/order-history:
    get:
      tags: [Orders]
      summary: 管理用の提供済み注文履歴を取得する
      description: 過去sessionを含むcompleted注文を新しい順に返す。close済みsessionの注文も削除せず保持する。
      operationId: listAdminOrderHistory
      responses:
        '200':
          description: completed注文を新しい順に返す
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderHistoryResponse'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '403':
          $ref: '#/components/responses/PermissionDenied'

  /v1/orders/{orderId}:
    get:
      tags: [Orders]
      summary: 注文詳細を取得する
      operationId: getOrder
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: kitchen/admin向けの価格スナップショットを含む注文詳細
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffOrder'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/orders/{orderId}/items/{orderItemId}/served:
    patch:
      tags: [Orders]
      summary: 注文品目の提供済み状態を更新する
      description: 最後の未提供品をservedにしたトランザクションで注文をcompletedへ移す。
      operationId: updateOrderItemServed
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/OrderItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateServedRequest'
      responses:
        '200':
          description: 更新後の注文。全品提供済みならstatusはcompleted。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffOrder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: expectedOrderVersion不一致、または完了済み注文
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServerBusy'

  /v1/staff-calls:
    get:
      tags: [StaffCalls]
      summary: スタッフ呼び出しを取得する
      operationId: listStaffCalls
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [open, resolved]
            default: open
      responses:
        '200':
          description: kitchen/admin向け呼び出し一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffCallsResponse'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '403':
          $ref: '#/components/responses/PermissionDenied'
    post:
      tags: [StaffCalls]
      summary: 客席からスタッフを呼び出す
      operationId: createStaffCall
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStaffCallRequest'
      responses:
        '201':
          description: 新規呼び出し
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffCallReceipt'
        '200':
          description: 同じclientCallIdの再送。既存呼び出しを返す。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffCallReceipt'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '403':
          $ref: '#/components/responses/DeviceNotRegistered'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/staff-calls/{staffCallId}/resolve:
    patch:
      tags: [StaffCalls]
      summary: スタッフ呼び出しを解決済みにする
      operationId: resolveStaffCall
      parameters:
        - $ref: '#/components/parameters/StaffCallId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedVersion]
              properties:
                expectedVersion:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: 解決後の呼び出し
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffCall'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VersionConflict'

  /v1/admin/menu-items/{menuItemId}:
    patch:
      tags: [Admin, Menu]
      summary: メニューの管理項目を更新する
      description: 更新後の値は新規注文から適用し、既存注文スナップショットは変更しない。
      operationId: updateMenuItem
      parameters:
        - $ref: '#/components/parameters/MenuItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMenuItemRequest'
      responses:
        '200':
          description: 更新後メニュー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminMenuItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VersionConflict'

  /v1/admin/menu-items/{menuItemId}/sold-out:
    patch:
      tags: [Admin, Menu]
      summary: 売り切れ状態を更新する
      description: 新規注文の受付可否だけを変更し、既存注文には影響させない。
      operationId: updateSoldOut
      parameters:
        - $ref: '#/components/parameters/MenuItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSoldOutRequest'
      responses:
        '200':
          description: 更新後メニュー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminMenuItem'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VersionConflict'

  /v1/admin/table-assignments/{tableId}:
    put:
      tags: [Admin, Device]
      summary: 客席端末とテーブルの固定割り当てを更新する
      description: 変更は新規注文から適用し、既存注文のtableNumberSnapshotは変更しない。
      operationId: updateTableAssignment
      parameters:
        - $ref: '#/components/parameters/TableId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTableAssignmentRequest'
      responses:
        '200':
          description: 更新後割り当て
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableAssignment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/AssignmentConflict'

  /v1/snapshot:
    get:
      tags: [System, Events]
      summary: イベント欠落時に権限別の最新状態を再取得する
      description: |
        customer、kitchen、adminそれぞれの公開範囲で、端末設定、メニュー、業務状態を再取得する。
        outer response、device、menu、activeOrders、openStaffCallsは同じ論理read snapshotに対応し、
        eventEpochとlastEventIdはすべて一致する。410を受けたクライアントは旧cacheを破棄し、
        このsnapshotのcursorからSSEへ再接続する。
      operationId: getSnapshot
      responses:
        '200':
          description: このスナップショットへ対応するlastEventIdを含む
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleScopedSnapshotResponse'
        '401':
          $ref: '#/components/responses/ReadOnlyAuthenticationFailed'
        '403':
          $ref: '#/components/responses/ReadOnlyAuthorizationFailed'
        '500':
          $ref: '#/components/responses/ReadOnlyInternalError'
        '503':
          $ref: '#/components/responses/ReadOnlyServiceUnavailable'

  /v1/tables/sessions/close:
    post:
      tags: [Orders]
      summary: 現在のテーブル来店を終了して席をリセットする
      description: |
        kitchenまたはadminだけが実行できる。tableIdとsessionIdは対象指定に使うが、注文の所有者や
        テーブル割り当ての根拠としては信頼しない。未提供の注文がある場合は409で拒否し、全注文がterminal
        の場合だけSQLiteトランザクション内でセッションを閉じる。再送は同じclosedAtMsを返すno-opである。
        注文行・注文明細・履歴は削除せず、客席の現在セッション履歴からだけ外れる。
      operationId: closeTableSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloseTableSessionRequest'
      responses:
        '200':
          description: セッションを閉じた、または同じclose要求をreplayした
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableSessionCloseResponse'
        '400':
          $ref: '#/components/responses/ReadOnlyBadRequest'
        '401':
          $ref: '#/components/responses/ReadOnlyAuthenticationFailed'
        '403':
          $ref: '#/components/responses/ReadOnlyAuthorizationFailed'
        '404':
          $ref: '#/components/responses/ReadOnlySessionNotFound'
        '409':
          $ref: '#/components/responses/ReadOnlySessionConflict'
        '500':
          $ref: '#/components/responses/ReadOnlyInternalError'
        '503':
          $ref: '#/components/responses/ReadOnlyServiceUnavailable'

  /v1/events:
    get:
      tags: [Events]
      summary: SSEで権限別イベントを受信する
      description: |
        Last-Event-IDとX-Event-Epochは両方指定するか、両方省略する。指定時は次のeventIdから
        欠落分を昇順送信し、その後ライブ配信する。両方省略した初回接続は現在tailからliveだけを受信する。
        正式な初期同期はsnapshot取得後、そのcursorで接続する。commit済みevent_logだけをrole別に投影し、
        生payload_jsonは公開しない。不可視イベントでもid-only cursor frameでcursorを進める。
        heartbeatはcommentとして送る。遅い接続は接続単位で制限・切断し、再接続replayへ戻す。
        SSE切断はREST注文の失敗を意味しない。履歴が利用不能なら410を返し、snapshotを取得する。
        Bearer tokenをURLへ出さずAuthorization headerを使えるfetch streaming clientを前提とする。
      operationId: streamEvents
      parameters:
        - $ref: '#/components/parameters/LastEventIdHeader'
        - $ref: '#/components/parameters/EventEpochHeader'
      responses:
        '200':
          description: |
            text/event-stream。各メッセージはid、event、dataを持つ。
            dataはRoleScopedEventEnvelopeのJSON表現。id-only frameとheartbeat commentはdataを持たない。
          headers:
            X-Event-Epoch:
              schema:
                $ref: '#/components/schemas/Uuid'
            X-Request-Id:
              schema:
                $ref: '#/components/schemas/Uuid'
          content:
            text/event-stream:
              schema:
                type: string
              example: |-
                id: 1842
                event: order.created
                data: {"audience":"kitchen","eventEpoch":"00000000-0000-4000-8000-000000000100","eventId":1842,"type":"order.created","aggregateId":"01912345-6789-4abc-8def-0123456789ab","occurredAtMs":1786280000000,"payload":{"resource":"orders","refreshRequired":true}}

        '400':
          $ref: '#/components/responses/ReadOnlyBadRequest'
        '401':
          $ref: '#/components/responses/ReadOnlyAuthenticationFailed'
        '403':
          $ref: '#/components/responses/ReadOnlyAuthorizationFailed'
        '410':
          $ref: '#/components/responses/EventHistoryUnavailable'
        '500':
          $ref: '#/components/responses/ReadOnlyInternalError'
        '503':
          $ref: '#/components/responses/ReadOnlyServiceUnavailable'

  /v1/events/replay:
    get:
      tags: [Events]
      summary: 欠落イベントをJSONで再取得する
      description: |
        limitはevent_logから走査する行数に適用し、role投影後のevents件数とは一致しない場合がある。
        lastEventIdは最後に走査した実在eventId（走査行がなければafterEventId）で、不可視イベントだけでも進む。
        hasMoreはそのcursorより後に未走査のDB eventがあることを示す。event_logはschema v2ではpruneしない。
      operationId: replayEvents
      parameters:
        - $ref: '#/components/parameters/EventEpochQueryRequired'
        - $ref: '#/components/parameters/AfterEventIdRequired'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 200
      responses:
        '200':
          description: afterEventIdより大きいイベントを昇順で返す
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleScopedEventReplayResponse'
        '400':
          $ref: '#/components/responses/ReadOnlyBadRequest'
        '401':
          $ref: '#/components/responses/ReadOnlyAuthenticationFailed'
        '403':
          $ref: '#/components/responses/ReadOnlyAuthorizationFailed'
        '410':
          $ref: '#/components/responses/EventHistoryUnavailable'
        '500':
          $ref: '#/components/responses/ReadOnlyInternalError'
        '503':
          $ref: '#/components/responses/ReadOnlyServiceUnavailable'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: random-device-token
      description: ペアリング時に一度だけ発行される256-bit以上の端末トークン

  parameters:
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    OrderItemId:
      name: orderItemId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    StaffCallId:
      name: staffCallId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    MenuItemId:
      name: menuItemId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/OpaqueId'
    TableId:
      name: tableId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        maxLength: 256
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    LastEventIdHeader:
      name: Last-Event-ID
      in: header
      required: false
      schema:
        type: string
        pattern: '^(0|[1-9][0-9]*)$'
      description: X-Event-Epochと同時に指定する。0以上のJavaScript safe integerだけを受け付ける。
    EventEpochHeader:
      name: X-Event-Epoch
      in: header
      required: false
      schema:
        $ref: '#/components/schemas/Uuid'
      description: Last-Event-IDと同時に指定する。両方省略した初回接続は現在tailからliveだけを受信する。
    EventEpochQueryRequired:
      name: eventEpoch
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    AfterEventId:
      name: afterEventId
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        maximum: 9007199254740991
    AfterEventIdRequired:
      name: afterEventId
      in: query
      required: true
      schema:
        type: integer
        minimum: 0
        maximum: 9007199254740991

  responses:
    ReadOnlyAuthenticationFailed:
      description: 端末トークンがない、形式不正、未登録、または失効済み
      headers:
        WWW-Authenticate:
          schema:
            type: string
            const: Bearer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReadOnlyErrorResponse'
    ReadOnlyAuthorizationFailed:
      description: 認証済み端末のroleまたはサーバー側端末設定では実行できない
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReadOnlyErrorResponse'
    ReadOnlyInternalError:
      description: 内部エラー。秘密情報、SQL、cause、stack traceは返さない。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReadOnlyErrorResponse'
    ReadOnlyServiceUnavailable:
      description: プロセスは応答したがDBが受付不能
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReadOnlyErrorResponse'
    ReadOnlyBadRequest:
      description: cursor、query、またはリクエスト形式が不正
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReadOnlyErrorResponse'
    ReadOnlySessionNotFound:
      description: セッションが存在しない、または対象指定が不正
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReadOnlyErrorResponse'
    ReadOnlySessionConflict:
      description: セッションが対象テーブルと一致しない、または未提供注文が残っている
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReadOnlyErrorResponse'
    OrderInvalidRequest:
      description: 注文JSON、schemaVersion、品目、数量、または許可fieldが不正
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReadOnlyErrorResponse'
    PayloadTooLarge:
      description: 注文bodyが16 KiBを超過
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReadOnlyErrorResponse'
    UnsupportedMediaType:
      description: application/json UTF-8以外、Content-Typeなし、またはContent-Encodingあり
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReadOnlyErrorResponse'
    OrderConflict:
      description: 同じclientOrderIdが異なる注文意図または端末で登録済み
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReadOnlyErrorResponse'
    OrderUnprocessable:
      description: 指定商品が存在しない、無効、または売り切れ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReadOnlyErrorResponse'
    BadRequest:
      description: JSON形式、必須項目、またはパラメーターが不正
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    AuthenticationFailed:
      description: 端末トークンがない、無効、または検証失敗
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Authentication failed
            status: 401
            code: authentication_failed
            requestId: req_01
    DeviceNotRegistered:
      description: 端末が未登録、失効、または無効
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Device is not registered
            status: 403
            code: device_not_registered
            requestId: req_01
    PermissionDenied:
      description: 認証済みだがroleに操作権限がない
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: 対象が存在しない、または権限上開示しない
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    IdempotencyConflict:
      description: 同じクライアントIDに異なるfingerprintが登録済み
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Idempotency conflict
            status: 409
            code: idempotency_conflict
            requestId: req_01
            details:
              clientOrderId: 01912345-6789-4abc-8def-0123456789ab
    VersionConflict:
      description: expectedVersionが現在値と一致しない
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    AssignmentConflict:
      description: 端末またはテーブルが別の割り当てに使用中
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InvalidOrder:
      description: |
        注文内容を受け付けられない。
        codeはinvalid_menu_item、item_sold_out、invalid_quantityのいずれか。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServerBusy:
      description: SQLite書き込みロックをbusy timeout内に取得できない
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    EventHistoryUnavailable:
      description: epoch不一致、未来cursor、またはcursor行欠落。旧cacheを破棄してsnapshot再取得が必要。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EventHistoryUnavailableResponse'
          example:
            error:
              code: EVENT_HISTORY_UNAVAILABLE
              message: Event history is unavailable.
            requestId: 00000000-0000-4000-8000-000000000901
            recovery:
              strategy: snapshot
              snapshotUrl: /v1/snapshot
              currentEventEpoch: 00000000-0000-4000-8000-000000000100
              lastEventId: 1842
    InternalError:
      description: 内部エラー。秘密情報やスタックトレースは返さない。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Uuid:
      type: string
      format: uuid
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    OpaqueId:
      type: string
      pattern: '^[A-Za-z0-9_-]{1,64}$'
    TimestampMs:
      type: integer
      format: int64
      minimum: 0
      description: UTC Unix epoch milliseconds
    EventId:
      type: integer
      format: int64
      minimum: 0
      maximum: 9007199254740991
    DeviceRole:
      type: string
      enum: [customer, kitchen, admin]
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code, requestId]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
          enum:
            - bad_request
            - authentication_failed
            - device_not_registered
            - device_mismatch
            - permission_denied
            - not_found
            - pairing_code_used
            - pairing_code_expired
            - assignment_conflict
            - idempotency_conflict
            - invalid_menu_item
            - item_sold_out
            - invalid_quantity
            - version_conflict
            - order_completed
            - event_history_unavailable
            - server_busy
            - internal_error
        detail:
          type: string
        requestId:
          type: string
          maxLength: 80
        details:
          type: object
          additionalProperties: true

    Health:
      type: object
      additionalProperties: false
      required: [status, db, serverTimeMs, schemaVersion, eventEpoch]
      properties:
        status:
          type: string
          const: ready
        db:
          type: string
          const: ready
        serverTimeMs:
          $ref: '#/components/schemas/TimestampMs'
        schemaVersion:
          type: integer
          const: 2
        eventEpoch:
          $ref: '#/components/schemas/Uuid'
    ReadOnlyErrorDetail:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - AUTHENTICATION_FAILED
            - AUTHORIZATION_FAILED
            - BAD_REQUEST
            - INVALID_ORDER_REQUEST
            - PAYLOAD_TOO_LARGE
            - UNSUPPORTED_MEDIA_TYPE
            - ORDER_CONFLICT
            - SESSION_NOT_FOUND
            - SESSION_CONFLICT
            - SESSION_HAS_ACTIVE_ORDERS
            - MENU_ITEM_NOT_FOUND
            - MENU_ITEM_SOLD_OUT
            - EVENT_HISTORY_UNAVAILABLE
            - NOT_FOUND
            - METHOD_NOT_ALLOWED
            - URI_TOO_LONG
            - INTERNAL_ERROR
            - SERVICE_UNAVAILABLE
        message:
          type: string
    ReadOnlyErrorResponse:
      type: object
      additionalProperties: false
      required: [error, requestId]
      properties:
        error:
          $ref: '#/components/schemas/ReadOnlyErrorDetail'
        requestId:
          $ref: '#/components/schemas/Uuid'
    CloseTableSessionRequest:
      type: object
      additionalProperties: false
      required: [tableId, sessionId]
      properties:
        tableId:
          type: integer
          minimum: 1
        sessionId:
          $ref: '#/components/schemas/Uuid'
    TableSession:
      type: object
      additionalProperties: false
      required: [sessionId, tableId, openedAtMs, version]
      properties:
        sessionId:
          $ref: '#/components/schemas/Uuid'
        tableId:
          type: integer
          minimum: 1
        openedAtMs:
          $ref: '#/components/schemas/TimestampMs'
        version:
          type: integer
          minimum: 1
    TableSessionCloseResponse:
      type: object
      additionalProperties: false
      required: [tableId, sessionId, closedAtMs, idempotencyResult]
      properties:
        tableId:
          type: integer
          minimum: 1
        sessionId:
          $ref: '#/components/schemas/Uuid'
        closedAtMs:
          $ref: '#/components/schemas/TimestampMs'
        idempotencyResult:
          type: string
          enum: [created, replayed]
    EventHistoryUnavailableErrorDetail:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          const: EVENT_HISTORY_UNAVAILABLE
        message:
          type: string
          const: Event history is unavailable.
    EventRecovery:
      type: object
      additionalProperties: false
      required: [strategy, snapshotUrl, currentEventEpoch, lastEventId]
      properties:
        strategy:
          type: string
          const: snapshot
        snapshotUrl:
          type: string
          const: /v1/snapshot
        currentEventEpoch:
          $ref: '#/components/schemas/Uuid'
        lastEventId:
          $ref: '#/components/schemas/EventId'
    EventHistoryUnavailableResponse:
      type: object
      additionalProperties: false
      required: [error, requestId, recovery]
      properties:
        error:
          $ref: '#/components/schemas/EventHistoryUnavailableErrorDetail'
        requestId:
          $ref: '#/components/schemas/Uuid'
        recovery:
          $ref: '#/components/schemas/EventRecovery'

    CreatePairingCodeRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/DeviceRole'
        tableId:
          type: integer
          minimum: 1
          description: customerでは必須。kitchen/adminでは指定禁止。
        ttlSeconds:
          type: integer
          minimum: 60
          maximum: 1800
          default: 600
    PairingCode:
      type: object
      additionalProperties: false
      required: [pairingCode, role, expiresAtMs]
      properties:
        pairingCode:
          type: string
          pattern: '^[A-Z0-9]{8,16}$'
        role:
          $ref: '#/components/schemas/DeviceRole'
        tableId:
          type: integer
          minimum: 1
        expiresAtMs:
          $ref: '#/components/schemas/TimestampMs'
    ClaimPairingRequest:
      type: object
      additionalProperties: false
      required: [pairingCode, deviceId, displayName, appVersion]
      properties:
        pairingCode:
          type: string
          pattern: '^[A-Z0-9]{8,16}$'
        deviceId:
          $ref: '#/components/schemas/Uuid'
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        appVersion:
          type: string
          minLength: 1
          maxLength: 40
    ClaimPairingResponse:
      type: object
      additionalProperties: false
      required: [deviceToken, config]
      properties:
        deviceToken:
          type: string
          minLength: 43
          maxLength: 128
          description: 256-bit以上のランダム値。平文はこの応答でだけ返す。
        config:
          $ref: '#/components/schemas/DeviceConfig'
    DeviceConfig:
      oneOf:
        - $ref: '#/components/schemas/CustomerDeviceConfig'
        - $ref: '#/components/schemas/KitchenDeviceConfig'
        - $ref: '#/components/schemas/AdminDeviceConfig'
      discriminator:
        propertyName: role
        mapping:
          customer: '#/components/schemas/CustomerDeviceConfig'
          kitchen: '#/components/schemas/KitchenDeviceConfig'
          admin: '#/components/schemas/AdminDeviceConfig'
    CustomerDeviceConfig:
      type: object
      additionalProperties: false
      required:
        - deviceId
        - role
        - deviceLabel
        - status
        - configVersion
        - eventEpoch
        - lastEventId
        - tableId
        - tableLabel
        - tableIsActive
      properties:
        deviceId:
          $ref: '#/components/schemas/Uuid'
        role:
          type: string
          const: customer
        deviceLabel:
          type: string
        status:
          type: string
          const: active
        configVersion:
          type: integer
          minimum: 1
        eventEpoch:
          $ref: '#/components/schemas/Uuid'
        lastEventId:
          $ref: '#/components/schemas/EventId'
        tableId:
          type: integer
          minimum: 1
        tableLabel:
          type: string
        tableIsActive:
          type: boolean
    KitchenDeviceConfig:
      type: object
      additionalProperties: false
      required: [deviceId, role, deviceLabel, status, configVersion, eventEpoch, lastEventId]
      properties:
        deviceId:
          $ref: '#/components/schemas/Uuid'
        role:
          type: string
          const: kitchen
        deviceLabel:
          type: string
        status:
          type: string
          const: active
        configVersion:
          type: integer
          minimum: 1
        eventEpoch:
          $ref: '#/components/schemas/Uuid'
        lastEventId:
          $ref: '#/components/schemas/EventId'
    AdminDeviceConfig:
      type: object
      additionalProperties: false
      required: [deviceId, role, deviceLabel, status, configVersion, eventEpoch, lastEventId]
      properties:
        deviceId:
          $ref: '#/components/schemas/Uuid'
        role:
          type: string
          const: admin
        deviceLabel:
          type: string
        status:
          type: string
          const: active
        configVersion:
          type: integer
          minimum: 1
        eventEpoch:
          $ref: '#/components/schemas/Uuid'
        lastEventId:
          $ref: '#/components/schemas/EventId'

    Category:
      type: object
      additionalProperties: false
      required: [categoryId, name, sortOrder]
      properties:
        categoryId:
          $ref: '#/components/schemas/OpaqueId'
        name:
          type: string
        sortOrder:
          type: integer
          minimum: 0
    AdminCategory:
      type: object
      additionalProperties: false
      required: [categoryId, name, sortOrder, isVisible, version, updatedAtMs]
      properties:
        categoryId:
          $ref: '#/components/schemas/OpaqueId'
        name:
          type: string
        sortOrder:
          type: integer
          minimum: 0
        isVisible:
          type: boolean
        version:
          type: integer
          minimum: 1
        updatedAtMs:
          $ref: '#/components/schemas/TimestampMs'
    CustomerMenuItem:
      type: object
      additionalProperties: false
      required: [menuItemId, categoryId, formalName, description, isSoldOut, sortOrder, version]
      properties:
        menuItemId:
          $ref: '#/components/schemas/OpaqueId'
        categoryId:
          $ref: '#/components/schemas/OpaqueId'
        formalName:
          type: string
        description:
          type: string
        isSoldOut:
          type: boolean
        sortOrder:
          type: integer
          minimum: 0
        imageUri:
          type: string
        version:
          type: integer
          minimum: 1
    KitchenMenuItem:
      type: object
      additionalProperties: false
      required:
        - menuItemId
        - categoryId
        - formalName
        - kitchenAlias
        - isSoldOut
        - sortOrder
        - version
      properties:
        menuItemId:
          $ref: '#/components/schemas/OpaqueId'
        categoryId:
          $ref: '#/components/schemas/OpaqueId'
        formalName:
          type: string
        kitchenAlias:
          type: string
        isSoldOut:
          type: boolean
        sortOrder:
          type: integer
          minimum: 0
        version:
          type: integer
          minimum: 1
    AdminMenuItem:
      type: object
      additionalProperties: false
      required:
        - menuItemId
        - categoryId
        - formalName
        - kitchenAlias
        - description
        - priceYen
        - isSoldOut
        - isActive
        - sortOrder
        - version
        - updatedAtMs
      properties:
        menuItemId:
          $ref: '#/components/schemas/OpaqueId'
        categoryId:
          $ref: '#/components/schemas/OpaqueId'
        formalName:
          type: string
        kitchenAlias:
          type: string
        description:
          type: string
        priceYen:
          type: integer
          minimum: 0
        isSoldOut:
          type: boolean
        isActive:
          type: boolean
        sortOrder:
          type: integer
          minimum: 0
        imageUri:
          type: string
        version:
          type: integer
          minimum: 1
        updatedAtMs:
          $ref: '#/components/schemas/TimestampMs'
    CustomerMenuResponse:
      type: object
      additionalProperties: false
      required: [audience, eventEpoch, lastEventId, categories, items]
      properties:
        audience:
          type: string
          const: customer
        eventEpoch:
          $ref: '#/components/schemas/Uuid'
        lastEventId:
          $ref: '#/components/schemas/EventId'
        categories:
          type: array
          items:
            $ref: '#/components/schemas/Category'
        items:
          type: array
          items:
            $ref: '#/components/schemas/CustomerMenuItem'
    KitchenMenuResponse:
      type: object
      additionalProperties: false
      required: [audience, eventEpoch, lastEventId, categories, items]
      properties:
        audience:
          type: string
          const: kitchen
        eventEpoch:
          $ref: '#/components/schemas/Uuid'
        lastEventId:
          $ref: '#/components/schemas/EventId'
        categories:
          type: array
          items:
            $ref: '#/components/schemas/Category'
        items:
          type: array
          items:
            $ref: '#/components/schemas/KitchenMenuItem'
    AdminMenuResponse:
      type: object
      additionalProperties: false
      required: [audience, eventEpoch, lastEventId, categories, items]
      properties:
        audience:
          type: string
          const: admin
        eventEpoch:
          $ref: '#/components/schemas/Uuid'
        lastEventId:
          $ref: '#/components/schemas/EventId'
        categories:
          type: array
          items:
            $ref: '#/components/schemas/AdminCategory'
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminMenuItem'

    CreateOrderItem:
      type: object
      additionalProperties: false
      required: [menuItemId, quantity]
      properties:
        menuItemId:
          $ref: '#/components/schemas/OpaqueId'
        quantity:
          type: integer
          minimum: 1
          maximum: 99
    CreateOrderRequest:
      type: object
      additionalProperties: false
      required: [schemaVersion, clientOrderId, items]
      properties:
        schemaVersion:
          type: integer
          const: 1
        clientOrderId:
          $ref: '#/components/schemas/Uuid'
        clientCreatedAtMs:
          $ref: '#/components/schemas/TimestampMs'
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/CreateOrderItem'
      description: |
        deviceId、role、tableId、価格、正式名、合計、fingerprintは送信しない。
        サーバーは認証済みdeviceIdとmenuItemId順に安定ソートしたitemsから、固定キー順・空白なしUTF-8 JSON
        {"fingerprintVersion":1,"authenticatedDeviceId":"<device UUID>","items":[{"menuItemId":"<id>","quantity":1}]}
        を作り、SHA-256を小文字hexで計算する。保存済みfingerprintは内部監査・競合判定専用で、customer向けレスポンスには含めない。
    OrderReceipt:
      type: object
      additionalProperties: false
      required: [orderId, clientOrderId, status, acceptedAtMs, idempotencyResult]
      properties:
        orderId:
          $ref: '#/components/schemas/Uuid'
        clientOrderId:
          $ref: '#/components/schemas/Uuid'
        status:
          type: string
          enum: [new, active, completed]
        acceptedAtMs:
          $ref: '#/components/schemas/TimestampMs'
        idempotencyResult:
          type: string
          enum: [created, replayed]
      description: customer向け。価格、合計、他テーブル情報を含めない。
    StaffOrderItem:
      type: object
      additionalProperties: false
      required:
        - orderItemId
        - formalNameSnapshot
        - kitchenAliasSnapshot
        - unitPriceYenSnapshot
        - quantity
        - lineTotalYen
        - isServed
      properties:
        orderItemId:
          type: integer
          minimum: 1
        menuItemId:
          type: string
        formalNameSnapshot:
          type: string
        kitchenAliasSnapshot:
          type: string
        unitPriceYenSnapshot:
          type: integer
          minimum: 0
        quantity:
          type: integer
          minimum: 1
          maximum: 99
        lineTotalYen:
          type: integer
          minimum: 0
        isServed:
          type: boolean
        servedAtMs:
          $ref: '#/components/schemas/TimestampMs'
    CustomerOrderItem:
      type: object
      additionalProperties: false
      required: [orderItemId, formalNameSnapshot, quantity, isServed]
      properties:
        orderItemId:
          type: integer
          minimum: 1
        menuItemId:
          type: string
          pattern: '^[A-Za-z0-9_-]{1,64}$'
        formalNameSnapshot:
          type: string
        quantity:
          type: integer
          minimum: 1
          maximum: 99
        isServed:
          type: boolean
        servedAtMs:
          $ref: '#/components/schemas/TimestampMs'
    CustomerOrder:
      type: object
      additionalProperties: false
      required: [orderId, clientOrderId, tableNumberSnapshot, status, acceptedAtMs, items]
      properties:
        orderId:
          $ref: '#/components/schemas/Uuid'
        clientOrderId:
